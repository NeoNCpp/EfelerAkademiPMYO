<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Efeler Akademi - PMYO Hazırlık</title>
<style>
  :root{
    --bg:#0a0a0a;
    --bg2:#111111;
    --card:#161616;
    --card2:#1d1d1d;
    --border:#2a2a2a;
    --gold:#d4af37;
    --gold-light:#f0dc9a;
    --gold-dim:#8a742c;
    --text:#f0f0f0;
    --muted:#999999;
    --danger:#e05c5c;
    --success:#4fbf7a;
    --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden;}
  body{
    background:radial-gradient(circle at 50% 0%, #1a1a1a 0%, var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; justify-content:center;
  }
  #phone{
    width:100%; max-width:480px; height:100vh; height:100dvh;
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .view{
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; flex-direction:column;
    padding:24px 20px 20px;
    transform:translateX(100%);
    transition:transform .35s cubic-bezier(.4,0,.2,1);
    opacity:0;
    pointer-events:none;
    overflow-y:auto;
  }
  .view.active{ transform:translateX(0); opacity:1; pointer-events:auto; }
  .view.exit-left{ transform:translateX(-100%); opacity:0; }

  #view-splash, #view-login{
    transform:none !important;
    transition:opacity .6s ease !important;
  }

  #view-login, #view-setup, #view-menu, #view-admin-login, #view-admin{
    background:
      radial-gradient(circle at 50% 15%, rgba(212,175,55,.35) 0%, rgba(212,175,55,.10) 28%, transparent 55%),
      linear-gradient(165deg, #000000 0%, #1a1400 30%, #2b2005 50%, #1a1400 70%, #000000 100%);
  }
  #view-test, #view-test-result, #view-classical, #view-my-results{
    background:
      radial-gradient(circle at 50% 15%, rgba(212,175,55,.18) 0%, rgba(212,175,55,.05) 28%, transparent 55%),
      linear-gradient(165deg, #000000 0%, #100c02 30%, #171102 50%, #100c02 70%, #000000 100%);
  }

  .brand{ text-align:center; margin-bottom:8px; }
  .brand .badge{
    width:64px; height:64px; border-radius:18px; margin:0 auto 10px;
    background:linear-gradient(145deg,var(--gold-light),var(--gold-dim));
    display:flex; align-items:center; justify-content:center;
    font-size:28px; font-weight:800; color:#1a1400;
    box-shadow:0 8px 24px rgba(212,175,55,.25);
  }
  .brand .logo-img{
    width:190px; height:190px; margin:0 auto 16px; display:block; border-radius:50%;
    filter:drop-shadow(0 8px 20px rgba(212,175,55,.35));
  }
  .brand h1{ font-size:32px; letter-spacing:1.4px; font-weight:800; }
  .gold-text{
    background:linear-gradient(155deg,#ffffff 0%, #fff3cf 30%, var(--gold-light) 55%, var(--gold) 78%, var(--gold) 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
    text-shadow:0 1px 0 rgba(0,0,0,.15);
  }
  .brand p{ color:var(--muted); font-size:12.5px; margin-top:2px; letter-spacing:.5px;}
  .brand p.sub-gold{ color:#ffffff; font-weight:700; letter-spacing:1.2px; font-size:14px; text-transform:uppercase; margin-top:6px; }

  .spacer{flex:1;}

  .field{ margin-top:18px; }
  .field label{ font-size:12px; color:var(--muted); display:block; margin-bottom:6px; letter-spacing:.3px;}
  .field input, .field textarea{
    width:100%; background:var(--card); border:1px solid var(--border); color:var(--text);
    padding:14px 14px; border-radius:12px; font-size:15px; outline:none;
  }
  .field input:focus, .field textarea:focus{ border-color:var(--gold-dim); }
  .field textarea{ resize:vertical; min-height:70px; }

  #view-login .field label, #view-setup .field label, #view-admin-login .field label, #view-admin .field label{ color:#ffffff; font-weight:600; }
  #view-login .field input, #view-setup .field input, #view-admin-login .field input, #view-admin .field input, #view-admin .field textarea, #view-admin .field select{
    background:rgba(212,175,55,.10);
    border:1px solid rgba(212,175,55,.45);
    color:#ffffff;
    backdrop-filter:blur(2px);
  }
  #view-login .field input::placeholder, #view-setup .field input::placeholder, #view-admin-login .field input::placeholder, #view-admin .field input::placeholder, #view-admin .field textarea::placeholder{ color:rgba(255,255,255,.55); }
  #view-login .field input:focus, #view-setup .field input:focus, #view-admin-login .field input:focus, #view-admin .field input:focus, #view-admin .field textarea:focus{ border-color:var(--gold-light); background:rgba(212,175,55,.16); }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:15px 18px; border-radius:14px; border:none; font-size:15px; font-weight:700;
    cursor:pointer; width:100%; transition:transform .15s, filter .15s;
  }
  .btn:active{ transform:scale(.97); }
  .btn-gold{ background:linear-gradient(145deg,var(--gold-light),var(--gold)); color:#1a1400; }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-outline:active{ border-color:var(--gold-dim); }
  .btn-danger{ background:rgba(224,92,92,.12); color:var(--danger); border:1px solid rgba(224,92,92,.3);}
  .btn-success{ background:rgba(79,191,122,.12); color:var(--success); border:1px solid rgba(79,191,122,.3);}
  .btn-sm{ padding:10px 12px; font-size:13px; width:auto; }
  .btn-block-row{ display:flex; gap:10px; margin-top:12px; }

  .menu-card{
    background:linear-gradient(145deg, rgba(212,175,55,.16), rgba(138,116,44,.08));
    border:1px solid rgba(212,175,55,.55); border-radius:var(--radius);
    padding:20px; margin-top:14px; display:flex; align-items:center; gap:14px; cursor:pointer;
    transition:border-color .15s, transform .15s, box-shadow .15s;
    box-shadow:0 0 18px rgba(212,175,55,.12);
  }
  .menu-card:active{ transform:scale(.98); border-color:var(--gold-light); box-shadow:0 0 22px rgba(212,175,55,.28); }
  .menu-card .icon{
    width:46px; height:46px; border-radius:12px;
    background:linear-gradient(145deg,var(--gold-light),var(--gold-dim));
    display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
    box-shadow:0 0 12px rgba(212,175,55,.35);
  }
  .menu-card .txt h3{ font-size:15.5px; margin-bottom:2px; color:var(--gold-light); }
  .menu-card .txt p{ font-size:12px; color:#d8c48f; }

  .topbar{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .topbar h2{ font-size:16px; font-weight:700; flex:1; }
  .back-btn{
    width:38px; height:38px; border-radius:12px;
    background:linear-gradient(145deg,var(--gold-light),var(--gold));
    border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:#1a1400;
    flex-shrink:0; box-shadow:0 3px 10px rgba(212,175,55,.35); transition:transform .15s;
  }
  .back-btn:active{ transform:scale(.9); }
  .back-btn svg{ width:19px; height:19px; }
  .pill{
    font-size:12px; font-weight:700; color:#1a1400; letter-spacing:.3px;
    background:linear-gradient(145deg,var(--gold-light),var(--gold));
    border:none; padding:6px 14px; border-radius:20px; box-shadow:0 3px 10px rgba(212,175,55,.3);
  }

  .progress-wrap{ height:6px; background:rgba(212,175,55,.12); border-radius:6px; overflow:hidden; margin:14px 0 4px; }
  .progress-bar{ height:100%; background:linear-gradient(90deg,var(--gold-dim),var(--gold)); border-radius:6px; transition:width .3s; }
  .progress-label{ font-size:11.5px; color:#d8c48f; text-align:right; margin-bottom:6px;}

  .q-card{
    background:linear-gradient(145deg, rgba(212,175,55,.09), rgba(80,66,20,.05));
    border:1px solid rgba(212,175,55,.35); border-radius:var(--radius); padding:20px; margin-top:14px;
    box-shadow:0 0 14px rgba(212,175,55,.06);
  }
  .q-card .q-text{ font-size:16px; line-height:1.5; font-weight:600; color:#fff8e8; }

  .option{
    margin-top:12px; padding:14px 16px; border-radius:12px;
    background:rgba(212,175,55,.035); border:1px solid rgba(212,175,55,.22);
    display:flex; align-items:center; gap:12px; cursor:pointer; font-size:14.5px; transition:all .15s; color:#f0e2bb;
  }
  .option .letter{
    width:26px; height:26px; border-radius:8px; background:rgba(0,0,0,.35); border:1px solid rgba(212,175,55,.4);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#d8c48f; flex-shrink:0;
  }
  .option.selected{ border-color:var(--gold-light); background:rgba(212,175,55,.16); }
  .option.selected .letter{ background:linear-gradient(145deg,var(--gold-light),var(--gold)); color:#1a1400; border-color:var(--gold); }
  .option.correct{ border-color:var(--success); background:rgba(79,191,122,.1); }
  .option.correct .letter{ background:var(--success); color:#08240f; border-color:var(--success); }
  .option.wrong{ border-color:var(--danger); background:rgba(224,92,92,.1); }
  .option.wrong .letter{ background:var(--danger); color:#2a0808; border-color:var(--danger); }

  .answer-box{
    margin-top:16px; padding:16px; border-radius:12px; background:rgba(212,175,55,.10); border:1px solid rgba(212,175,55,.4);
    font-size:14.5px; line-height:1.5; display:none; color:#f0e2bb;
  }
  .answer-box.show{ display:block; }
  .answer-box .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--gold-light); margin-bottom:6px; font-weight:700;}

  .score-circle{
    width:150px; height:150px; border-radius:50%; margin:20px auto 6px;
    background:linear-gradient(145deg, rgba(212,175,55,.16), rgba(138,116,44,.08)); border:4px solid var(--gold-dim);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 0 22px rgba(212,175,55,.2);
  }
  .score-circle .num{ font-size:38px; font-weight:800; color:var(--gold-light); }
  .score-circle .lbl{ font-size:11px; color:#d8c48f; }

  .stat-row{ display:flex; gap:10px; margin-top:18px; }
  .stat-box{ flex:1; background:linear-gradient(145deg, rgba(212,175,55,.12), rgba(138,116,44,.05)); border:1px solid rgba(212,175,55,.35); border-radius:12px; padding:14px; text-align:center; }
  .stat-box .n{ font-size:22px; font-weight:800; }
  .stat-box .l{ font-size:11px; color:#d8c48f; margin-top:2px; }
  .stat-box.ok .n{ color:var(--success); }
  .stat-box.bad .n{ color:var(--danger); }

  .review-item{ background:linear-gradient(145deg, rgba(212,175,55,.12), rgba(138,116,44,.05)); border:1px solid rgba(212,175,55,.35); border-radius:12px; padding:14px; margin-top:10px; }
  .review-item .q{ font-size:13.5px; font-weight:600; margin-bottom:6px; color:#fff8e8; }
  .review-item .a{ font-size:12.5px; color:#d8c48f; }
  .review-item .a.ok{ color:var(--success); }
  .review-item .a.bad{ color:var(--danger); }

  .empty-state{ text-align:center; color:#d8c48f; font-size:13.5px; margin-top:40px; padding:0 20px; }

  .gear{
    position:fixed; bottom:14px; right:14px; width:34px; height:34px; border-radius:50%;
    background:var(--card); border:1px solid var(--border); display:none; align-items:center; justify-content:center;
    font-size:14px; color:var(--muted); opacity:.5; z-index:50; cursor:pointer;
  }
  #view-login.active ~ .gear{ display:flex; }

  .splash-glow{ position:relative; width:320px; height:320px; display:flex; align-items:center; justify-content:center; }
  .splash-glow::before{
    content:''; position:absolute; width:320px; height:320px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,221,140,.95) 0%, rgba(212,175,55,.65) 30%, rgba(212,175,55,.25) 55%, transparent 75%);
    filter:blur(14px); animation:splashPulse 1.8s ease-in-out infinite;
  }
  .splash-logo{
    width:150px; height:150px; position:relative; z-index:2; border-radius:50%;
    animation:splashSpin 1.6s linear infinite;
    filter:drop-shadow(0 0 25px rgba(255,221,140,.9));
  }
  @keyframes splashSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @keyframes splashPulse{ 0%,100%{ transform:scale(1); opacity:.8; } 50%{ transform:scale(1.3); opacity:1; } }

  .tabs{ display:flex; gap:8px; margin-top:14px; background:rgba(212,175,55,.08); border:1px solid rgba(212,175,55,.35); padding:4px; border-radius:12px; }
  .tab{ flex:1; text-align:center; padding:9px 0; border-radius:9px; font-size:13px; font-weight:600; color:#d8c48f; cursor:pointer; }
  .tab.active{ background:linear-gradient(145deg,var(--gold-light),var(--gold)); color:#1a1400; }

  .list-item{
    background:linear-gradient(145deg, rgba(212,175,55,.14), rgba(138,116,44,.06));
    border:1px solid rgba(212,175,55,.45); border-radius:12px; padding:14px; margin-top:10px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .list-item .qt{ font-size:13.5px; font-weight:600; flex:1; color:var(--gold-light); }
  .list-item .qm{ font-size:11.5px; color:#d8c48f; margin-top:4px; }
  .del-x{ width:28px; height:28px; border-radius:8px; background:rgba(224,92,92,.12); color:var(--danger); border:none; font-size:14px; flex-shrink:0; cursor:pointer; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--card2); border:1px solid var(--gold-dim); color:var(--text); padding:12px 18px; border-radius:12px;
    font-size:13px; z-index:100; transition:all .25s; pointer-events:none; max-width:90%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .loader{ text-align:center; margin-top:60px; color:var(--muted); font-size:13px; }

  ::-webkit-scrollbar{ width:0; }
  h4.section-title{ font-size:12px; color:var(--gold-light); text-transform:uppercase; letter-spacing:.6px; margin:20px 0 4px; }
</style>
</head>
<body>
<div id="phone">

  <!-- SETUP (ilk kurulum, sadece bir kere) -->
  <div class="view" id="view-setup">
    <div class="spacer"></div>
    <div class="brand">
      <h1 class="gold-text" style="font-size:18px;">İLK KURULUM</h1>
      <p class="sub-gold" style="margin-top:8px;">Bulut Veritabanı Henüz Bağlı Değil</p>
    </div>
    <div class="field">
      <p style="color:var(--muted);font-size:13px;line-height:1.7;">
        Aşağıdaki butona bas — sistem bulutta bir veritabanı oluşturacak. Çıkan kodu kopyalayıp Claude'a gönder,
        kalıcı olarak bu veritabanına bağlanmış hâliyle dosyayı sana geri vereyim.
      </p>
    </div>
    <button class="btn btn-gold" id="setupBtn" style="margin-top:20px" onclick="setupCreateBin()">Veritabanını Oluştur</button>
    <div class="field" id="setupResultWrap" style="display:none;">
      <label>Veritabanı ID</label>
      <input type="text" id="setupBinId" readonly onclick="this.select()">
      <button class="btn btn-outline" style="margin-top:10px" onclick="copySetupId()">Kopyala</button>
    </div>
    <div class="spacer"></div>
  </div>
